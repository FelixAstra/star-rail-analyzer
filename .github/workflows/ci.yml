name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check all JS
        run: |
          status=0
          while IFS= read -r f; do
            node --check "$f" || status=1
          done < <(git ls-files '*.js')
          exit $status

      - name: Divination engine assertions (offline, data-independent)
        run: node tools/verify-divination.js

      - name: Dashboard statistics & forecast assertions (offline, data-independent)
        run: node tools/verify-dashboard.js

      # analyze.js 导出的字段必须覆盖组件模板读的字段（真珠那次是模板用了
      # c.srcKeys、视图漏导出 → 39 张卡的「数据来源」被静默标错）
      - name: View field contract (analyze.js exports ⊆ analysis.js templates)
        run: node tools/verify-view-contract.js

      - name: i18n coverage (zh + en)
        run: node tools/check-i18n.js

      - name: Boot smoke test (empty data, 9 endpoints)
        run: node tools/ci-smoke.js
